<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Terminal - Serial Console</title>
    <link rel="stylesheet" href="js/xterm.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h1>Web Terminal</h1>
            </div>
            <div class="header-controls">
                <div class="control-group">
                    <label for="device-select">Device:</label>
                    <select id="device-select">
                        <option value="">Select device...</option>
                    </select>
                    <button id="refresh-devices" class="btn btn-icon" title="Refresh devices">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                    </button>
                </div>
                <div class="control-group">
                    <label for="baudrate-select">Baud:</label>
                    <select id="baudrate-select">
                        <option value="9600">9600</option>
                        <option value="19200">19200</option>
                        <option value="38400">38400</option>
                        <option value="57600">57600</option>
                        <option value="115200" selected>115200</option>
                        <option value="230400">230400</option>
                        <option value="460800">460800</option>
                        <option value="921600">921600</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="local-echo">
                        <span>Echo</span>
                    </label>
                </div>
                <button id="connect-btn" class="btn btn-primary">Connect</button>
            </div>
        </header>

        <main class="terminal-container">
            <div id="terminal"></div>
        </main>

        <footer class="status-bar">
            <div class="status-left">
                <span class="status-indicator">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Disconnected</span>
                </span>
            </div>
            <div class="status-right">
                <button id="clear-btn" class="btn btn-small" title="Clear terminal">Clear</button>
            </div>
        </footer>
    </div>

    <script src="js/xterm.min.js"></script>
    <script src="js/xterm-addon-fit.min.js"></script>
    <script src="js/xterm-addon-web-links.min.js"></script>
    <script src="js/terminal.js"></script>
</body>
</html>
